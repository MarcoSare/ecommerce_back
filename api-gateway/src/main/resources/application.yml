spring:
  application:
    name: api-gateway

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          jwk-set-uri: "http://localhost:9000/oauth2/jwks"

  cloud:
    loadbalancer:
      enabled: true

    gateway:
     server:
      webflux:
       routes:
        - id: msv-clientes
          uri: lb://msv-clientes
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=2

        - id: msv-region
          uri: lb://msv-region
          predicates:
            - Path=/api/region/**
          filters:
            - StripPrefix=2

        - id: msv-movimiento
          uri: lb://msv-movimiento
          predicates:
            - Path=/api/movimiento/**
          filters:
            - StripPrefix=2

        - id: msv-productos
          uri: lb://msv-productos
          predicates:
            - Path=/api/productos/**
          filters:
            - StripPrefix=2

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
